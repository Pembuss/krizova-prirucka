# Nastavenia Netlify pre vetvu „netlify“ (hotový web zo zostavenia v GitHub Actions).
# Netlify nič nezostavuje – iba zverejní súbory tak, ako sú. Zdroj: deploy/netlify.toml vo vetve main.
[build]
  publish = "."

# Service worker sa musí vždy overiť na serveri, inak by sa nové verzie aplikácie oneskorovali
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/downloads/*.epub"
  [headers.values]
    Content-Type = "application/epub+zip"

# Časti offline balíka – aplikácia ich stiahne a spojí do jedného ZIP
[[headers]]
  for = "/downloads/offline/*"
  [headers.values]
    Content-Type = "application/octet-stream"
